<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suika Game - Evolution Size Edition</title>
    <!-- かわいい丸文字フォントを導入 -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body class="game-page">

<div class="bg-decoration" style="width: 300px; height: 300px; top: 10%; left: 5%; animation-delay: 0s;"></div>
<div class="bg-decoration" style="width: 400px; height: 400px; bottom: 10%; right: 5%; animation-delay: -2s;"></div>
<div class="bg-decoration" style="width: 200px; height: 200px; top: 40%; right: 20%; animation-delay: -5s;"></div>

<div id="main-wrapper">
    <div id="side-panel">
        <div class="score-container">
            <div class="score-label">スコア</div>
            <span id="score">0</span>
        </div>

        <div class="next-container">
            <div class="next-label">つぎ</div>
            <div id="next-fruit" class="next-fruit-display">🍓</div>
        </div>

        <div id="evolution-visualizer">
            <div class="evolution-bg-ring"></div>
            <svg id="evolution-arrows-svg" style="position:absolute; width:100%; height:100%; pointer-events:none;">
                <defs>
                    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                        <polygon points="0 0, 8 3, 0 6" fill="#ffe0e6" />
                    </marker>
                </defs>
            </svg>
            <div class="evo-center-label">しんか</div>
        </div>
        <div class="side-controls">
            <button id="btn-screenshot" class="side-btn" onclick="takeScreenshot()" style="background:#ffb3c1; box-shadow: 0 5px 0 #e59aa8;">スクショ</button>
            <button id="btn-timemachine" class="side-btn" onclick="saveTimeMachineVideo()" style="background:#a0c4ff; box-shadow: 0 5px 0 #84a9e6;">どうがほぞん</button>
            <button id="give-up-btn" class="side-btn" onclick="giveUpGame()">あきらめる</button>
        </div>
    </div>

    <div id="game-container">
        <div id="game-over-message" class="hidden">おしまい！</div>
        <div id="game-over">
            <h1>けっか</h1>
            <div class="game-over-content">
                <div class="final-score-box">
                    <div style="font-size: 14px; color: var(--text-sub);">スコア</div>
                    <div id="final-score" style="font-weight:900; font-size: 32px;">0</div>
                </div>
                <button onclick="resetGame()">もういっかい</button>
                <button onclick="window.location.href='index.html'" style="background:#c0b9dd; box-shadow: 0 5px 0 #9f97bf; margin-top:10px;">タイトルへ</button>
            </div>
        </div>
    </div>
</div>

<!-- BGM -->
<audio id="bgm" src="https://github.com/AfterEffects-OK/SuikaGame/raw/refs/heads/main/MusMus-BGM-078%20%5B%20%E7%9F%B3%E7%95%B3%E3%81%AE%E4%B8%8B%E3%81%A7%20%5D.mp3" loop></audio>

<div id="flash-overlay"></div>
<div id="screenshot-message" class="hidden">ほぞんちゅう...</div>
<div id="rec-indicator" class="hidden">🔴 REC</div>

<div id="share-modal" class="hidden">
    <div class="share-content">
        <p>ファイルをほぞんしました！<br>Xでシェアしますか？</p>
        <p class="share-note">※ほぞんされたファイルを<br>しゅどうでてんぷしてください</p>
        <button id="btn-share-x" onclick="shareToX()">Xにとうこうする</button>
        <button id="btn-share-insta" onclick="shareToInsta()">Instagramをひらく</button>
        <button id="btn-share-line" onclick="shareToLine()">LINEでおくる</button>
        <button class="btn-close" onclick="closeShareModal()">とじる</button>
    </div>
</div>

<script src="constants.js"></script>
<script src="script.js" defer></script>
</body>
</html>
