<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suika Game - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body class="game-page">

<div class="bg-decoration" style="width: 300px; height: 300px; top: 10%; left: 5%; animation-delay: 0s;"></div>
<div class="bg-decoration" style="width: 400px; height: 400px; bottom: 10%; right: 5%; animation-delay: -2s;"></div>
<div class="bg-decoration" style="width: 200px; height: 200px; top: 40%; right: 20%; animation-delay: -5s;"></div>

<div id="demo-container"></div>

<!-- タイトル画面 -->
<div id="title-screen" class="screen-overlay">
    <div class="title-box">
        <h1 class="menu-title">Suika Game<br><span style="font-size:24px; color:var(--text-sub); text-shadow: none;">Evolution Edition</span></h1>
        <div class="menu-buttons">
            <button id="btn-game-start">ゲームスタート</button>
            <button id="btn-how-to" style="background:#c0b9dd; box-shadow: 0 5px 0 #9f97bf;">あそびかた</button>
            <button id="btn-scores" style="background:#ffb3c1; box-shadow: 0 5px 0 #e59aa8;">ハイスコア</button>
        </div>
    </div>
</div>

<!-- あそびかた画面 -->
<div id="how-to-screen" class="screen-overlay hidden">
    <div class="modal-content">
        <h2 style="color:var(--accent-pink); margin-top:0;">あそびかた</h2>
        <p>フルーツを落として、同じフルーツ同士をくっつけよう！<br>くっつくと進化して大きくなるよ。</p>
        <div id="fruit-list-container" class="fruit-list">
            <!-- JSで生成 -->
        </div>
        <p>点線のラインから溢れないように気をつけてね！</p>
        
        <div class="settings-container">
            <div class="setting-item">
                <span>BGM</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="bgm-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>こうかおん</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="se-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <span style="font-size: 14px;">保存場所を選ぶ</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="save-dialog-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <button class="btn-back-to-title">もどる</button>
    </div>
</div>

<!-- ハイスコア画面 -->
<div id="high-score-screen" class="screen-overlay hidden">
    <div class="modal-content">
        <div class="tab-container">
            <button id="tab-btn-highscore" class="tab-btn">ハイスコア</button>
            <button id="tab-btn-ranking" class="tab-btn">ランキング</button>
        </div>

        <div id="highscore-content" class="hidden">
            <div class="high-score-display" id="high-score-value">0</div>
        </div>

        <div id="ranking-content" class="hidden">
            <div id="ranking-list-container" class="ranking-list"></div>
        </div>

        <button class="btn-back-to-title" style="margin-top: 20px;">もどる</button>
    </div>
</div>

<audio id="bgm" src="https://github.com/AfterEffects-OK/SuikaGame/raw/refs/heads/main/PukaPukaPuzzle-15dB.mp3" loop></audio>

<div id="evolution-visualizer" style="display:none;"></div>
<svg id="evolution-arrows-svg" style="display:none;"></svg>

<script src="constants.js"></script>
<script src="menu.js"></script>
</body>

</html>
