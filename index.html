<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suika Game - Evolution Size Edition</title>
    <!-- かわいい丸文字フォントを導入 -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body class="game-page">

<div class="bg-decoration" style="width: 300px; height: 300px; top: 10%; left: 5%; animation-delay: 0s;"></div>
<div class="bg-decoration" style="width: 400px; height: 400px; bottom: 10%; right: 5%; animation-delay: -2s;"></div>
<div class="bg-decoration" style="width: 200px; height: 200px; top: 40%; right: 20%; animation-delay: -5s;"></div>

<!-- タイトル画面 -->
<div id="title-screen" class="screen-overlay">
    <div class="title-box">
        <h1 class="menu-title">Suika Game<br><span style="font-size:24px; color:var(--text-sub); text-shadow: none;">Evolution Edition</span></h1>
        <div class="menu-buttons">
            <button id="btn-game-start">ゲームスタート</button>
            <button onclick="showHowTo()" style="background:#c0b9dd; box-shadow: 0 5px 0 #9f97bf;">あそびかた</button>
            <button onclick="showScores()" style="background:#ffb3c1; box-shadow: 0 5px 0 #e59aa8;">ハイスコア</button>
        </div>
    </div>
</div>

<!-- あそびかた画面 -->
<div id="how-to-screen" class="screen-overlay hidden">
    <div class="modal-content">
        <h2 style="color:var(--accent-pink); margin-top:0;">あそびかた</h2>
        <p>フルーツを落として、同じフルーツ同士をくっつけよう！<br>くっつくと進化して大きくなるよ。</p>
        <div id="fruit-list-container" class="fruit-list">
            <!-- JSで生成 -->
        </div>
        <p>点線のラインから溢れないように気をつけてね！</p>
        <button onclick="returnToTitle()">もどる</button>
    </div>
</div>

<!-- ハイスコア画面 -->
<div id="high-score-screen" class="screen-overlay hidden">
    <div class="modal-content">
        <div class="tab-container">
            <button id="tab-btn-highscore" class="tab-btn" onclick="showTab('highscore')">ハイスコア</button>
            <button id="tab-btn-ranking" class="tab-btn" onclick="showTab('ranking')">ランキング</button>
        </div>

        <div id="highscore-content" class="hidden">
            <div class="high-score-display" id="high-score-value">0</div>
        </div>

        <div id="ranking-content" class="hidden">
            <div id="ranking-list-container" class="ranking-list"></div>
        </div>

        <button onclick="returnToTitle()" style="margin-top: 20px;">もどる</button>
    </div>
</div>

<div id="main-wrapper" class="hidden">
    <div id="side-panel">
        <div class="score-container">
            <div class="score-label">スコア</div>
            <span id="score">0</span>
        </div>

        <div class="next-container">
            <div class="next-label">つぎ</div>
            <div id="next-fruit" class="next-fruit-display">🍓</div>
        </div>

        <div id="evolution-visualizer">
            <div class="evolution-bg-ring"></div>
            <svg id="evolution-arrows-svg" style="position:absolute; width:100%; height:100%; pointer-events:none;">
                <defs>
                    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                        <polygon points="0 0, 8 3, 0 6" fill="#ffe0e6" />
                    </marker>
                </defs>
            </svg>
            <div class="evo-center-label">しんか</div>
        </div>
        <button id="give-up-btn" onclick="giveUpGame()">あきらめる</button>
    </div>

    <div id="game-container">
        <div id="game-over-message" class="hidden">おしまい！</div>
        <div id="game-over">
            <h1>けっか</h1>
            <div class="game-over-content">
                <div class="final-score-box">
                    <div style="font-size: 14px; color: var(--text-sub);">スコア</div>
                    <div id="final-score" style="font-weight:900; font-size: 32px;">0</div>
                </div>
                <button onclick="resetGame()">もういっかい</button>
                <button onclick="location.reload()" style="background:#c0b9dd; box-shadow: 0 5px 0 #9f97bf; margin-top:10px;">タイトルへ</button>
            </div>
        </div>
    </div>
</div>

<!-- BGM -->
<audio id="bgm" src="https://github.com/AfterEffects-OK/SuikaGame/raw/refs/heads/main/MusMus-BGM-078%20%5B%20%E7%9F%B3%E7%95%B3%E3%81%AE%E4%B8%8B%E3%81%A7%20%5D.mp3" loop></audio>

<script src="script.js" defer></script>
</body>
</html>
