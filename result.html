<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suika Game - Result</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="result-page">
    <div class="result-card">
        <h1>けっか</h1>
        
        <div class="stats-container">
            <div class="score-section">
                <div class="label">スコア</div>
                <div class="score-value" id="score">0</div>
                <div class="label" style="margin-top:5px; font-size:12px;">ハイスコア: <span id="high-score">0</span></div>
            </div>

            <div class="max-fruit-section">
                <div class="label">さいだい しんか</div>
                <div class="max-fruit-icon" id="max-fruit-icon">❓</div>
                <div class="max-fruit-name" id="max-fruit-name">---</div>
            </div>
        </div>

        <div class="label">しんかの きろく</div>
        <div class="evolution-chart" id="evolution-chart">
            <!-- JSで生成 -->
        </div>

        <div class="button-container">
            <button onclick="retryGame()" class="btn-retry">もういっかい</button>
            <button onclick="saveResult()" class="btn-record" id="btn-record">きろくする</button>
            <button id="btn-save-video" class="btn-save-video" onclick="saveVideo()" style="background:#a0c4ff; box-shadow: 0 5px 0 #84a9e6;">どうがをほぞん</button>
            <button onclick="goToMenu()" class="btn-menu">メニューに もどる</button>
        </div>
    </div>

    <!-- ランキングモーダル -->
    <div id="ranking-modal" class="ranking-modal">
        <div class="ranking-content">
            <h2 style="color:var(--accent-pink); margin-top:0;">ランキング</h2>
            <div id="ranking-list" class="ranking-list"></div>
            <button onclick="closeRanking()" class="btn-menu" style="margin-top:20px;">とじる</button>
        </div>
    </div>

    <!-- 名前入力モーダル -->
    <div id="name-input-modal" class="ranking-modal">
        <div class="ranking-content">
            <h2 style="color:var(--accent-pink); margin-top:0;">おなまえ を おしえてね</h2>
            <input type="text" id="player-name-input" class="name-input" placeholder="ななし" maxlength="10">
            <div class="modal-btn-container">
                <button onclick="submitName()" class="btn-retry">OK</button>
                <button onclick="closeNameInput()" class="btn-menu">キャンセル</button>
            </div>
        </div>
    </div>

    <script src="result.js" defer></script>
</body>
</html>
