<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suika Game - Result</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff9f0;
            --panel-bg: #ffffff;
            --accent-pink: #ff8fa3;
            --text-main: #5d576b;
            --text-sub: #a7a2b6;
            --border-color: #ffe0e6;
            --dot-color: rgba(255, 143, 163, 0.08);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }
        .result-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 40px;
            border: 8px solid var(--accent-pink);
            box-shadow: 0 20px 50px rgba(255, 143, 163, 0.3);
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        h1 {
            color: var(--accent-pink);
            font-size: 42px;
            margin: 0 0 30px 0;
            text-shadow: 3px 3px 0 #fff, 5px 5px 0 var(--border-color);
        }
        .score-section {
            margin-bottom: 30px;
        }
        .label {
            font-size: 16px;
            color: var(--text-sub);
            font-weight: bold;
            margin-bottom: 5px;
        }
        .score-value {
            font-size: 64px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1;
        }
        .max-fruit-section {
            background: var(--bg-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 4px solid var(--border-color);
        }
        .max-fruit-icon {
            font-size: 80px;
            line-height: 1.2;
            animation: bounce 2s infinite;
        }
        .max-fruit-name {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-pink);
        }
        .evolution-chart {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }
        .evo-item {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            background: #fff;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            opacity: 0.3;
            filter: grayscale(100%);
            transition: all 0.5s ease;
        }
        .evo-item.reached {
            opacity: 1;
            filter: none;
            border-color: var(--accent-pink);
            box-shadow: 0 4px 8px rgba(255, 143, 163, 0.2);
            transform: scale(1.1);
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        button {
            border: none;
            padding: 15px 40px;
            color: white;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 20px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.1s;
            width: 100%;
        }
        .btn-retry { background: var(--accent-pink); box-shadow: 0 5px 0 #e67e91; }
        .btn-record { background: #ffb3c1; box-shadow: 0 5px 0 #e59aa8; }
        .btn-menu { background: var(--text-sub); box-shadow: 0 5px 0 #888; }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #e67e91;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* 紙吹雪エフェクト */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
            z-index: -1;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>
    <div class="result-card">
        <h1>結果発表</h1>
        
        <div class="score-section">
            <div class="label">スコア</div>
            <div class="score-value" id="score">0</div>
            <div class="label" style="margin-top:10px; font-size:14px;">ハイスコア: <span id="high-score">0</span></div>
        </div>

        <div class="max-fruit-section">
            <div class="label">今回の最大進化</div>
            <div class="max-fruit-icon" id="max-fruit-icon">❓</div>
            <div class="max-fruit-name" id="max-fruit-name">---</div>
        </div>

        <div class="label">進化のきろく</div>
        <div class="evolution-chart" id="evolution-chart">
            <!-- JSで生成 -->
        </div>

        <div class="button-container">
            <button onclick="retryGame()" class="btn-retry">もう一回やる</button>
            <button onclick="saveResult()" class="btn-record" id="btn-record">結果を記録する</button>
            <button onclick="goToMenu()" class="btn-menu">メニューに戻る</button>
        </div>
    </div>

    <script>
        const FRUIT_TYPES = [
            { name: 'さくらんぼ', emoji: '🍒' },
            { name: 'いちご', emoji: '🍓' },
            { name: 'ぶどう', emoji: '🍇' },
            { name: 'デコポン', emoji: '🍊' },
            { name: 'かき', emoji: '🍅' },
            { name: 'りんご', emoji: '🍎' },
            { name: 'なし', emoji: '🍐' },
            { name: 'もも', emoji: '🍑' },
            { name: 'パイナップル', emoji: '🍍' },
            { name: 'メロン', emoji: '🍈' },
            { name: 'スイカ', emoji: '🍉' }
        ];

        const params = new URLSearchParams(window.location.search);
        const score = params.get('score') || 0;
        const maxFruitIndex = parseInt(params.get('maxFruit') || 0);
        const HIGH_SCORE_KEY = 'vibe_suika_highscore';

        document.getElementById('score').innerText = score;
        document.getElementById('high-score').innerText = localStorage.getItem(HIGH_SCORE_KEY) || 0;

        // 最大フルーツ表示
        if (FRUIT_TYPES[maxFruitIndex]) {
            document.getElementById('max-fruit-icon').innerText = FRUIT_TYPES[maxFruitIndex].emoji;
            document.getElementById('max-fruit-name').innerText = FRUIT_TYPES[maxFruitIndex].name;
        }

        // 進化チャート生成
        const chartContainer = document.getElementById('evolution-chart');
        FRUIT_TYPES.forEach((fruit, index) => {
            const item = document.createElement('div');
            item.className = 'evo-item';
            if (index <= maxFruitIndex) {
                item.classList.add('reached');
            }
            item.innerText = fruit.emoji;
            chartContainer.appendChild(item);
        });

        // 紙吹雪エフェクト
        function createConfetti() {
            const colors = ['#ff8fa3', '#ffb3c1', '#c0b9dd', '#fff0f3', '#ffccd5'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 5000);
            }
        }
        createConfetti();

        // ボタン機能
        function retryGame() {
            window.location.href = 'index.html?retry=true';
        }

        function goToMenu() {
            window.location.href = 'index.html';
        }

        function saveResult() {
            const history = JSON.parse(localStorage.getItem('vibe_suika_history') || '[]');
            const newRecord = {
                date: new Date().toLocaleString(),
                score: score,
                maxFruit: maxFruitIndex
            };
            history.push(newRecord);
            localStorage.setItem('vibe_suika_history', JSON.stringify(history));
            
            const btn = document.getElementById('btn-record');
            btn.innerText = '記録しました！';
            btn.disabled = true;
            btn.style.backgroundColor = '#ccc';
            btn.style.boxShadow = 'none';
            btn.style.transform = 'translateY(3px)';
        }
    </script>
</body>
</html>
